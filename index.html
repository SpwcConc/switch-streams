<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Switch Streams</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 18px;
    text-align: center;
    border-bottom: 1px solid #292929;
}

h1 {
    margin: 0;
    font-size: 25px;
}

#players {
    display: none;
    padding: 10px;
}

.player {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

iframe {
    width: 100%;
    height: 500px;
    border: 0;
}

.back {
    display: block;
    margin: 10px auto;
    padding: 12px 20px;
    background: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 8px;
    font-size: 16px;
}

#list {
    padding: 15px;
}

.stream {
    background: #1c1c1c;
    border: 1px solid #303030;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 10px;
    font-size: 19px;
}

.stream:active {
    background: #292929;
}
</style>
</head>

<body>

<header>
    <h1>SWITCH STREAMS</h1>
</header>

<div id="list">

    <div class="stream" onclick="openStream('darm')">
        🔴 Darm
    </div>

    <div class="stream" onclick="openStream('demus')">
        🔴 Demus
    </div>

    <div class="stream" onclick="openStream('toose')">
        🔴 Toose
    </div>

</div>

<div id="players">

    <button class="back" onclick="back()">
        ← Назад
    </button>

    <div class="player">
        <iframe
            id="twitch"
            allowfullscreen>
        </iframe>
    </div>

</div>

<script>
const channels = {
    darm: "darm",
    demus: "demus",
    toose: "toose"
};

function openStream(name) {

    const channel = channels[name];

    document.getElementById("list").style.display = "none";
    document.getElementById("players").style.display = "block";

    const parent = window.location.hostname;

    document.getElementById("twitch").src =
        "https://player.twitch.tv/?channel=" +
        channel +
        "&parent=" +
        parent +
        "&autoplay=false";
}

function back() {

    document.getElementById("players").style.display = "none";
    document.getElementById("list").style.display = "block";

    document.getElementById("twitch").src = "";
}
</script>

</body>
</html>
