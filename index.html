<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch Streams</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 20px;
    border-bottom: 1px solid #333;
}

h1 {
    margin: 0;
    font-size: 24px;
}

#menu {
    padding: 20px;
    max-width: 600px;
    margin: auto;
}

.stream {
    background: #1d1d1d;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 12px;
    font-size: 20px;
}

.stream:active {
    background: #333;
}

#watch {
    display: none;
    padding: 10px;
}

.back {
    display: block;
    margin: 0 auto 10px;
    padding: 12px 25px;
    background: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 8px;
    font-size: 17px;
}

.player {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    aspect-ratio: 16 / 9;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
}
</style>
</head>

<body>

<header>
    <h1>SWITCH STREAMS</h1>
</header>

<div id="menu">

    <div class="stream" onclick="watch('darmfn_')">
        🔴 Darm
    </div>

    <div class="stream" onclick="watch('Crun4chTheBest')">
        🔴 Demus
    </div>

    <div class="stream" onclick="watch('TooseFN')">
        🔴 Toose
    </div>

</div>

<div id="watch">

    <button class="back" onclick="back()">
        ← Назад
    </button>

    <div class="player">
        <iframe
            id="player"
            allowfullscreen>
        </iframe>
    </div>

</div>

<script>

function watch(channel) {

    document.getElementById("menu").style.display = "none";
    document.getElementById("watch").style.display = "block";

    document.getElementById("player").src =
        "https://player.twitch.tv/?channel=" +
        channel +
        "&parent=spwcconc.github.io";
}

function back() {

    document.getElementById("player").src = "";

    document.getElementById("watch").style.display = "none";
    document.getElementById("menu").style.display = "block";
}

</script>

</body>
</html>
