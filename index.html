<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Switch Streams</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #101010;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    padding: 22px 15px;
    text-align: center;
    border-bottom: 1px solid #292929;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

#list {
    padding: 18px;
    max-width: 700px;
    margin: auto;
}

.stream {
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 12px;
    font-size: 19px;
    cursor: pointer;
    user-select: none;
}

.stream:active {
    background: #303030;
}

#playerPage {
    display: none;
    padding: 15px;
}

.back {
    display: block;
    margin: 0 auto 15px auto;
    padding: 12px 22px;
    background: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 9px;
    font-size: 17px;
}

#playerBox {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    background: #000;
}

#twitchPlayer {
    display: block;
    width: 100%;
    height: 500px;
    border: 0;
}

#status {
    text-align: center;
    color: #aaa;
    padding: 20px;
    font-size: 15px;
}

@media (max-width: 600px) {
    #twitchPlayer {
        height: 300px;
    }
}
</style>
</head>

<body>

<header>
    <h1>SWITCH STREAMS</h1>
</header>

<!-- СПИСОК СТРИМЕРОВ -->
<div id="list">

    <div class="stream" onclick="openStream('darmfn_')">
        🔴 Darm
    </div>

    <div class="stream" onclick="openStream('Crun4chTheBest')">
        🔴 Demus
    </div>

    <div class="stream" onclick="openStream('TooseFN')">
        🔴 Toose
    </div>

</div>


<!-- СТРАНИЦА ПЛЕЕРА -->
<div id="playerPage">

    <button class="back" onclick="goBack()">
        ← Назад
    </button>

    <div id="playerBox">

        <iframe
            id="twitchPlayer"
            allowfullscreen
            scrolling="no">
        </iframe>

    </div>

    <div id="status">
        Twitch player
    </div>

</div>


<script>

const PARENT = "spwcconc.github.io";

function openStream(channel) {

    document.getElementById("list").style.display = "none";
    document.getElementById("playerPage").style.display = "block";

    const iframe = document.getElementById("twitchPlayer");

    iframe.src =
        "https://player.twitch.tv/?" +
        "channel=" + encodeURIComponent(channel) +
        "&parent=" + encodeURIComponent(PARENT) +
        "&autoplay=false" +
        "&muted=false";

    document.getElementById("status").textContent =
        "Загрузка " + channel + "...";

    window.scrollTo(0, 0);
}


function goBack() {

    const iframe = document.getElementById("twitchPlayer");

    iframe.src = "";

    document.getElementById("playerPage").style.display = "none";
    document.getElementById("list").style.display = "block";

    window.scrollTo(0, 0);
}

</script>

</body>
</html>
    <div class="player">
        <iframe
            id="twitch"
            allowfullscreen>
        </iframe>
    </div>

</div>

<script>
const channels = {
    darm: "darm",
    demus: "demus",
    toose: "toose"
};

function openStream(name) {

    const channel = channels[name];

    document.getElementById("list").style.display = "none";
    document.getElementById("players").style.display = "block";

    const parent = window.location.hostname;

    document.getElementById("twitch").src =
        "https://player.twitch.tv/?channel=" +
        channel +
        "&parent=" +
        parent +
        "&autoplay=false";
}

function back() {

    document.getElementById("players").style.display = "none";
    document.getElementById("list").style.display = "block";

    document.getElementById("twitch").src = "";
}
</script>

</body>
</html>
